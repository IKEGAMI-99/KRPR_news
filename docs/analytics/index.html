<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17131f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Kirapara News アクセス解析</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">公開集計</p>
        <h1>アクセス解析</h1>
        <p id="updatedAt" class="muted">データを読み込み中…</p>
      </div>
      <div class="live-dot" title="アクセス解析"></div>
    </header>

    <section class="kpis">
      <article class="kpi"><span>本日</span><strong id="todayViews">—</strong><small>PV</small></article>
      <article class="kpi"><span>過去7日</span><strong id="weekViews">—</strong><small>PV</small></article>
      <article class="kpi"><span>過去30日</span><strong id="monthViews">—</strong><small>PV</small></article>
      <article class="kpi"><span>過去30日ユーザー</span><strong id="monthUsers">—</strong><small>人</small></article>
    </section>

    <section class="panel wide">
      <div class="panel-head"><div><p class="eyebrow">推移</p><h2>日別ページビュー（過去30日）</h2></div></div>
      <div id="trendChart" class="trend" aria-label="過去30日の日別ページビュー推移"></div>
    </section>

    <section class="grid">
      <article class="panel"><div class="panel-head"><div><p class="eyebrow">人気</p><h2>人気ページ</h2></div></div><div id="pages" class="rank-list"></div></article>
      <article class="panel"><div class="panel-head"><div><p class="eyebrow">流入</p><h2>流入元</h2></div></div><div id="referrers" class="bars"></div></article>
      <article class="panel"><div class="panel-head"><div><p class="eyebrow">地域</p><h2>国・地域</h2></div></div><div id="regions" class="bars"></div></article>
      <article class="panel"><div class="panel-head"><div><p class="eyebrow">端末</p><h2>デバイス</h2></div></div><div id="devices" class="bars"></div></article>
    </section>

    <footer>Kirapara News · 個人を特定しない集計値のみ表示</footer>
  </main>
  <script src="./app.js?v=5" defer></script>
</body>
</html>
