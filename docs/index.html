<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d59be8">
  <meta name="description" content="きらめきパラダイス / 以闪亮之名 / Life Makeover / 스타일라잇 のニュースをまとめて読むPWA">
  <title>Kirapara News</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./ai.css">
  <link rel="stylesheet" href="./share.css">
  <link rel="stylesheet" href="./theme-kawaii.css">
  <link rel="stylesheet" href="./layout-fixes.css?v=48">
  <link rel="stylesheet" href="./gallery-strip.css">
  <link rel="stylesheet" href="./day-sections.css">
  <link rel="stylesheet" href="./menu.css">
  <link rel="stylesheet" href="./menu-install.css">
  <link rel="stylesheet" href="./source-buttons.css">
  <link rel="stylesheet" href="./x-image-size.css?v=48">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand-mark brand-mark-logo" aria-hidden="true"><img src="./icon.svg" alt=""></div>
        <div class="brand-copy"><h1>Kirapara News</h1><p id="statusText">最終更新 取得中…</p></div>
        <div class="header-actions">
          <button id="installButton" class="icon-button install-button" type="button" hidden aria-label="ホーム画面に追加" title="ホーム画面に追加">＋</button>
          <button id="menuButton" class="icon-button" type="button" aria-label="メニュー" title="メニュー">☰</button>
          <button id="themeButton" class="icon-button" type="button" aria-label="テーマ切替" title="テーマ切替">☾</button>
          <button id="refreshButton" class="icon-button" type="button" aria-label="更新" title="更新">↻</button>
        </div>
      </div>
      <nav id="regionTabs" class="region-tabs" aria-label="地域フィルター">
        <button class="region-tab is-active" type="button" data-region="ALL">すべて <span data-count="ALL">0</span></button>
        <button class="region-tab" type="button" data-region="JAPAN">🇯🇵 日本 <span data-count="JAPAN">0</span></button>
        <button class="region-tab" type="button" data-region="CHINA">🇨🇳 中国 <span data-count="CHINA">0</span></button>
        <button class="region-tab" type="button" data-region="KOREA">🇰🇷 韓国 <span data-count="KOREA">0</span></button>
        <button class="region-tab" type="button" data-region="GLOBAL">🌐 Global <span data-count="GLOBAL">0</span></button>
      </nav>
    </header>
    <main>
      <section id="newsGrid" class="news-grid" aria-live="polite" aria-busy="true"></section>
      <div id="emptyState" class="empty-state" hidden><div class="empty-mark">◇</div><h2>ニュースが見つかりません</h2><p id="emptyMessage">地域タブを変えてみてください。</p></div>
      <div id="errorState" class="error-state" hidden><div class="empty-mark">!</div><h2>読み込みに失敗しました</h2><p id="errorMessage">通信状態を確認して、もう一度更新してください。</p><button id="retryButton" class="primary-button" type="button">再読み込み</button></div>
    </main>
    <footer><p>非公式ファンツール。AI翻訳・要約には誤りが含まれる場合があります。</p></footer>
  </div>
  <template id="newsCardTemplate"><article class="news-card"><button class="card-image-link" type="button" aria-label="サムネイル画像を拡大"><div class="card-image-wrap"><img class="card-image" alt="" loading="lazy" decoding="async"><div class="image-fallback" aria-hidden="true">✦</div><span class="region-badge"></span></div></button><div class="card-content"><div class="card-meta"><span class="platform"></span><time class="published"></time></div><h3 class="card-title"></h3><p class="card-body"></p><div class="card-actions"><button class="more-button" type="button">続きを読む</button><a class="source-button" target="_blank" rel="noopener noreferrer">元記事を開く ↗</a></div></div></article></template>
  <script>
    if ('serviceWorker' in navigator) {
      let reloadingForServiceWorker = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadingForServiceWorker) return;
        reloadingForServiceWorker = true;
        location.reload();
      });
    }
  </script>
  <script src="./analytics-config.js"></script>
  <script src="./analytics-track.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./x-image-fix.js?v=47" defer></script>
  <script src="./source-buttons.js" defer></script>
  <script src="./crawl-status.js" defer></script>
  <script src="./weibo-image-fallback.js" defer></script>
  <script src="./share.js" defer></script>
  <script src="./menu.js" defer></script>
  <script src="./menu-install.js" defer></script>
  <script src="./back-navigation.js?v=47" defer></script>
  <script src="./viewer-lifecycle-fix.js?v=47" defer></script>
</body>
</html>
