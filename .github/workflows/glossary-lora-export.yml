name: Export LoRA Glossary Seed

on:
  push:
    branches:
      - main
    paths:
      - 'data/translation_glossary.json'
      - 'scripts/glossary_schema.py'
      - 'scripts/export_lora_glossary.py'
      - 'tests/test_glossary_lora.py'
      - '.github/workflows/glossary-lora-export.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirapara-glossary-lora-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate glossary and LoRA conversion
        run: python -m unittest tests.test_glossary_lora -v

      - name: Export verified glossary entries
        run: python scripts/export_lora_glossary.py

      - name: Validate exported JSONL
        shell: bash
        run: |
          set -euo pipefail
          test -s data/training/glossary_lora_seed.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/training/glossary_lora_seed.jsonl')
          count = 0
          for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
              if not line.strip():
                  continue
              row = json.loads(line)
              messages = row.get('messages')
              metadata = row.get('metadata')
              if not isinstance(messages, list) or len(messages) != 3:
                  raise SystemExit(f'invalid messages at line {line_no}')
              if [m.get('role') for m in messages] != ['system', 'user', 'assistant']:
                  raise SystemExit(f'invalid roles at line {line_no}')
              if not isinstance(metadata, dict) or not metadata.get('glossaryId'):
                  raise SystemExit(f'missing glossaryId at line {line_no}')
              count += 1
          if count == 0:
              raise SystemExit('LoRA seed contains no records')
          print(f'Validated {count} LoRA seed records')
          PY

      - name: Commit generated seed only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/training/glossary_lora_seed.jsonl && git ls-files --error-unmatch data/training/glossary_lora_seed.jsonl >/dev/null 2>&1; then
            echo 'LoRA glossary seed is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/training/glossary_lora_seed.jsonl
          git commit -m 'chore: sync verified glossary LoRA seed'

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
              python -m unittest tests.test_glossary_lora -v
              python scripts/export_lora_glossary.py
              git add data/training/glossary_lora_seed.jsonl
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Failed to push LoRA glossary seed after retries' >&2
          exit 1
