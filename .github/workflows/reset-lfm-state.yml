name: Reset AI State and Start Gemma 4 E4B LiteRT

on:
  push:
    paths:
      - '.github/workflows/reset-lfm-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: true

jobs:
  reset-and-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reset every article to original source state
        run: python -u scripts/reset_ai_state.py

      - name: Commit clean original state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json data/sol_overrides.json data/sol_audit_state.json
          if git diff --cached --quiet; then
            echo "AI state was already clean"
          else
            git commit -m "[skip ai] chore: reset all articles to original"
            git pull --rebase origin main
            git push
          fi

      - name: Cache Gemma 4 E4B LiteRT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-gemma4-e4b-litertlm-v1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-litert-lm-0.16.1-v1
          restore-keys: |
            kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Verify or download Gemma 4 E4B LiteRT model
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/gemma-4-E4B-it.litertlm"
          SHA256="0b2a8980ce155fd97673d8e820b4d29d9c7d99b8fa6806f425d969b145bd52e0"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL"
          fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              -o "$MODEL" \
              "https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install LiteRT-LM runtime
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "litert-lm==0.16.1"

      - name: Process newest articles immediately
        env:
          LLM_MAX_ITEMS: '20'
        run: |
          python -u scripts/strict_gemma_translate.py translate \
            --model "$HOME/.cache/kirapara-models/gemma-4-E4B-it.litertlm"

      - name: Compare overseas previews with Japan feed
        run: python scripts/tag_early_info.py

      - name: Commit initial Gemma 4 batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          if git diff --cached --quiet; then
            echo "No Gemma 4 changes"
          else
            git commit -m "chore: process newest articles with Gemma 4 E4B LiteRT"
            git pull --rebase origin main
            git push
          fi
