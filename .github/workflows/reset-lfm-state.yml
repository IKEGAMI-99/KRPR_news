name: Reset AI State and Start LFM2.5

on:
  push:
    paths:
      - '.github/workflows/reset-lfm-state.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: true

jobs:
  reset-and-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reset every article to original source state
        run: python -u scripts/reset_ai_state.py

      - name: Commit clean original state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json data/sol_overrides.json data/sol_audit_state.json
          if git diff --cached --quiet; then
            echo "AI state was already clean"
          else
            git commit -m "[skip ai] chore: reset all articles to original"
            git pull --rebase origin main
            git push
          fi

      - name: Cache LFM2.5 8B A1B GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-lfm2.5-8b-a1b-q4-k-m-v1

      - name: Cache pip and llama.cpp wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-llama-cpp-python-0.3.34-v1
          restore-keys: |
            kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Verify or download LFM2.5 8B A1B GGUF
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/LFM2.5-8B-A1B-Q4_K_M.gguf"
          SHA256="4923ec14f06b968b74d663e5949867d2d9c3bf13a20b8be1a9f9af39989b2bb0"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL"
          fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              -o "$MODEL" \
              "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B-GGUF/resolve/main/LFM2.5-8B-A1B-Q4_K_M.gguf?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install LFM2.5-compatible llama.cpp runtime
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "llama-cpp-python==0.3.34" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Process newest articles immediately
        env:
          LLM_MAX_ITEMS: '50'
        run: |
          python -u scripts/strict_lfm_translate.py translate \
            --model "$HOME/.cache/kirapara-models/LFM2.5-8B-A1B-Q4_K_M.gguf"

      - name: Compare overseas previews with Japan feed
        run: python scripts/tag_early_info.py

      - name: Commit initial LFM2.5 batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          if git diff --cached --quiet; then
            echo "No LFM2.5 changes"
          else
            git commit -m "chore: process newest articles with LFM2.5"
            git pull --rebase origin main
            git push
          fi
