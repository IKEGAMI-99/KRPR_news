name: Set article cap to 800

on:
  push:
    paths:
      - '.github/workflows/set-article-cap-800.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Raise retention cap from 260 to 800
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('scripts/normalize_news.py'),
              Path('scripts/discover_web_news.py'),
              Path('scripts/merge_duplicate_sources.py'),
              Path('scripts/fetch_wechat_official.py'),
              Path('scripts/fetch_haoyoukuaibao.py'),
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count('[:260]')
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one [:260] cap, found {count}')
              path.write_text(text.replace('[:260]', '[:800]'), encoding='utf-8')
              print(f'updated {path}')
          PY

      - name: Commit article-cap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/normalize_news.py \
                  scripts/discover_web_news.py \
                  scripts/merge_duplicate_sources.py \
                  scripts/fetch_wechat_official.py \
                  scripts/fetch_haoyoukuaibao.py
          git commit -m "chore: raise article cap to 800"
          git push origin HEAD:main
