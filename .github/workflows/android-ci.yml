name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android native toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Prepare official llama.cpp
        run: bash scripts/prepare_llama_android.sh

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "========== Android build failure (tail) =========="
            tail -n 240 build.log
            echo "========== Extracted errors =========="
            grep -Ei "(^|[[:space:]])(error:|fatal error:|CMake Error|ninja:|FAILURE:|What went wrong|Execution failed|Unresolved reference|e: )" build.log | tail -n 120 || true
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kirapara-News-debug
          path: app/build/outputs/apk/debug/app-debug.apk
