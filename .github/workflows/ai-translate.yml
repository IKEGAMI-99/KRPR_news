name: Translate News with Gemma 4 E4B LiteRT

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Refresh News Cache'
    types:
      - completed
  push:
    paths:
      - 'scripts/translation_engine.py'
      - 'scripts/translation_quality.py'
      - 'scripts/strict_gemma_translate.py'
      - 'scripts/merge_translation_results.py'
      - 'scripts/audit_translations.py'
      - 'scripts/apply_sol_edits.py'
      - 'scripts/glossary_schema.py'
      - 'data/translation_glossary.json'
      - 'data/sol_news.json'
      - 'data/sol_overrides.json'
      - '.github/workflows/ai-translate.yml'

permissions:
  contents: write

concurrency:
  group: kirapara-ai-translate
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ai]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.llm_plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks
        run: python scripts/apply_sol_edits.py

      - name: Count articles still needing current Gemma translation
        id: llm_plan
        run: python -u scripts/strict_gemma_translate.py prepare --github-output "$GITHUB_OUTPUT"

  translate:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks before Gemma 4
        run: python scripts/apply_sol_edits.py

      - name: Recheck Gemma backlog
        id: llm_plan
        run: python -u scripts/strict_gemma_translate.py prepare --github-output "$GITHUB_OUTPUT"

      - name: Cache Gemma 4 E4B LiteRT model
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-gemma4-e4b-litertlm-v1

      - name: Cache pip packages
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-litert-lm-0.16.1-v1
          restore-keys: |
            kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Verify or download Gemma 4 E4B LiteRT model
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/gemma-4-E4B-it.litertlm"
          SHA256="0b2a8980ce155fd97673d8e820b4d29d9c7d99b8fa6806f425d969b145bd52e0"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL"
          fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --http1.1 \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 -C - \
              -o "$MODEL" \
              "https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install LiteRT-LM runtime
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "litert-lm==0.16.1"

      - name: Translate and summarize exactly up to three articles with Gemma 4 E4B
        if: steps.llm_plan.outputs.pending != '0'
        env:
          LLM_MAX_ITEMS: '3'
        run: |
          python -u scripts/strict_gemma_translate.py translate \
            --model "$HOME/.cache/kirapara-models/gemma-4-E4B-it.litertlm"

      - name: Reapply Sol locks after Gemma 4
        if: steps.llm_plan.outputs.pending != '0'
        run: python scripts/apply_sol_edits.py

      - name: Commit Gemma translations with semantic retry
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/translations.json)" ]; then
            echo "No translation changes"
            exit 0
          fi

          incoming_cache="${RUNNER_TEMP}/gemma-translations.json"
          cp data/translations.json "$incoming_cache"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          git commit -m "chore: translate news with Gemma 4 E4B LiteRT"

          for attempt in 1 2 3 4; do
            echo "Translation push attempt ${attempt}/4"
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              set +e
              git merge --no-commit --no-ff origin/main
              merge_status=$?
              set -e

              conflicts="$(git diff --name-only --diff-filter=U)"
              unexpected_conflicts="$(printf '%s\n' "$conflicts" | grep -vFx -e '' -e 'data/news.json' -e 'data/translations.json' || true)"
              if [ -n "$unexpected_conflicts" ]; then
                echo "Unexpected merge conflicts:"
                printf '%s\n' "$unexpected_conflicts"
                git merge --abort || true
                exit 1
              fi
              if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
                echo "Merge failed without a resolvable data-file conflict"
                git merge --abort || true
                exit 1
              fi

              # The newest main owns the collected article set. Reapply this
              # run's generated cache entries semantically on top of it.
              git checkout origin/main -- data/news.json data/translations.json
              python scripts/merge_translation_results.py --incoming "$incoming_cache"
              python scripts/apply_sol_edits.py
              python scripts/strict_gemma_translate.py prepare
              git add data/news.json data/translations.json

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved merge conflicts remain"
                git merge --abort || true
                exit 1
              fi
              git commit --no-edit
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Translation push failed after retries"
          exit 1
