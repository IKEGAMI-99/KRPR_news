name: Translate News with Qwen

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/translate_news_llm.py'
      - 'scripts/audit_translations.py'
      - 'scripts/apply_sol_edits.py'
      - 'scripts/glossary_schema.py'
      - 'scripts/run_with_runtime_glossary.py'
      - 'data/translation_glossary.json'
      - 'data/sol_news.json'
      - 'data/sol_overrides.json'
      - '.github/workflows/ai-translate.yml'

permissions:
  contents: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.llm_plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks
        run: python scripts/apply_sol_edits.py

      - name: Count pending translations
        id: llm_plan
        run: python scripts/translate_news_llm.py prepare --github-output "$GITHUB_OUTPUT"

  translate:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks before Qwen
        run: python scripts/apply_sol_edits.py

      - name: Recheck pending translations
        id: llm_plan
        run: python scripts/translate_news_llm.py prepare --github-output "$GITHUB_OUTPUT"

      - name: Cache Qwen 3B GGUF
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-qwen2.5-3b-instruct-q4-k-m-v1

      - name: Cache pip and built llama.cpp wheel
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-llama-cpp-python-0.3.16-v1
          restore-keys: |
            kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Verify or download Qwen 3B GGUF
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/qwen2.5-3b-instruct-q4_k_m.gguf"
          SHA256="626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL"
          fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              -o "$MODEL" \
              "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install local llama.cpp runtime
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "llama-cpp-python==0.3.16" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Translate and summarize queued articles locally
        if: steps.llm_plan.outputs.pending != '0'
        env:
          LLM_MAX_ITEMS: '50'
        run: |
          python -u scripts/run_with_runtime_glossary.py scripts/translate_news_llm.py translate \
            --model "$HOME/.cache/kirapara-models/qwen2.5-3b-instruct-q4_k_m.gguf"

      - name: Compare overseas previews with Japan feed
        if: steps.llm_plan.outputs.pending != '0'
        run: python scripts/tag_early_info.py

      - name: Reapply Sol locks after Qwen
        if: steps.llm_plan.outputs.pending != '0'
        run: python scripts/apply_sol_edits.py

      - name: Commit AI cache when changed
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/translations.json)" ]; then
            echo "No translation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          git commit -m "chore: translate queued news with Qwen"
          git pull --rebase origin main
          git push
