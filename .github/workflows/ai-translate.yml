name: Translate News with LFM2.5

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/translate_news_llm.py'
      - 'scripts/strict_qwen_translate.py'
      - 'scripts/strict_lfm_translate.py'
      - 'scripts/audit_translations.py'
      - 'scripts/apply_sol_edits.py'
      - 'scripts/glossary_schema.py'
      - 'data/translation_glossary.json'
      - 'data/sol_news.json'
      - 'data/sol_overrides.json'
      - '.github/workflows/ai-translate.yml'

permissions:
  contents: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.llm_plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks
        run: python scripts/apply_sol_edits.py

      - name: Reject non-Japanese cache and count pending translations
        id: llm_plan
        run: python -u scripts/strict_lfm_translate.py prepare --github-output "$GITHUB_OUTPUT"

  translate:
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit suspicious cached translations
        run: python scripts/audit_translations.py

      - name: Restore Sol-managed locks before LFM2.5
        run: python scripts/apply_sol_edits.py

      - name: Recheck strict Japanese pending translations
        id: llm_plan
        run: python -u scripts/strict_lfm_translate.py prepare --github-output "$GITHUB_OUTPUT"

      - name: Cache LFM2.5 8B A1B GGUF
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-lfm2.5-8b-a1b-q4-k-m-v1

      - name: Cache pip and llama.cpp wheel
        if: steps.llm_plan.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-llama-cpp-python-0.3.34-v1
          restore-keys: |
            kirapara-pip-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Verify or download LFM2.5 8B A1B GGUF
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/LFM2.5-8B-A1B-Q4_K_M.gguf"
          SHA256="4923ec14f06b968b74d663e5949867d2d9c3bf13a20b8be1a9f9af39989b2bb0"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            rm -f "$MODEL"
          fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 \
              -o "$MODEL" \
              "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B-GGUF/resolve/main/LFM2.5-8B-A1B-Q4_K_M.gguf?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install LFM2.5-compatible llama.cpp runtime
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "llama-cpp-python==0.3.34" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Translate and summarize queued articles in strict Japanese
        if: steps.llm_plan.outputs.pending != '0'
        env:
          LLM_MAX_ITEMS: '50'
        run: |
          python -u scripts/strict_lfm_translate.py translate \
            --model "$HOME/.cache/kirapara-models/LFM2.5-8B-A1B-Q4_K_M.gguf"

      - name: Compare overseas previews with Japan feed
        if: steps.llm_plan.outputs.pending != '0'
        run: python scripts/tag_early_info.py

      - name: Reapply Sol locks after LFM2.5
        if: steps.llm_plan.outputs.pending != '0'
        run: python scripts/apply_sol_edits.py

      - name: Commit AI cache when changed
        if: steps.llm_plan.outputs.pending != '0'
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/translations.json)" ]; then
            echo "No translation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          git commit -m "chore: translate queued news with LFM2.5"
          git pull --rebase origin main
          git push
