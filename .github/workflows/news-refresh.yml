name: Refresh News Cache

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_news.py'
      - 'scripts/merge_direct_official.py'
      - 'scripts/enrich_sources.py'
      - 'scripts/enrich_social_images.py'
      - 'scripts/enrich_weibo_images.py'
      - 'scripts/normalize_weibo_cdn.py'
      - 'scripts/enrich_bilibili_images.py'
      - 'scripts/upgrade_x_images.py'
      - 'scripts/fetch_wechat_official.py'
      - 'scripts/discover_web_news.py'
      - 'scripts/enrich_images.py'
      - 'scripts/filter_small_images.py'
      - 'scripts/normalize_news.py'
      - 'scripts/translate_news_llm.py'
      - 'scripts/strict_qwen_translate.py'
      - 'scripts/strict_gemma_translate.py'
      - 'scripts/glossary_schema.py'
      - 'scripts/tag_early_info.py'
      - 'scripts/apply_sol_edits.py'
      - 'data/translation_glossary.json'
      - 'data/sol_news.json'
      - 'data/sol_overrides.json'
      - 'data/refresh_kick.json'
      - '.github/workflows/news-refresh.yml'

permissions:
  contents: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public news in original languages
        run: |
          python scripts/fetch_news.py
          python scripts/merge_direct_official.py
          python scripts/enrich_sources.py
          python scripts/enrich_social_images.py
          python scripts/enrich_weibo_images.py
          python scripts/normalize_weibo_cdn.py
          python scripts/enrich_bilibili_images.py
          python scripts/upgrade_x_images.py
          python scripts/fetch_wechat_official.py
          python scripts/discover_web_news.py
          python scripts/enrich_images.py
          python scripts/filter_small_images.py
          python scripts/normalize_news.py

      - name: Merge Sol supplemental news and reviewed translations
        run: python scripts/apply_sol_edits.py

      - name: Apply only Japanese-safe cached translations without running the LLM
        run: python -u scripts/strict_gemma_translate.py prepare

      - name: Compare overseas previews with Japan feed
        run: python scripts/tag_early_info.py

      - name: Reapply Sol locks
        run: python scripts/apply_sol_edits.py

      - name: Commit refreshed news when changed
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/translations.json data/article_dates.json data/image_quality.json)" ]; then
            echo "No news, date, image-quality, translation or advance-info changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json data/article_dates.json data/image_quality.json
          git commit -m "chore: refresh normalized news"
          git pull --rebase origin main
          git push
