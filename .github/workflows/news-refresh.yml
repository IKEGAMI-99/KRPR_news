name: Refresh News Cache

# ai-translate.yml subscribes to successful completion through workflow_run.
on:
  workflow_call:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_news.py'
      - 'scripts/run_refresh_pipeline.py'
      - 'scripts/preserve_official_x_history.py'
      - 'scripts/merge_direct_official.py'
      - 'scripts/enrich_sources.py'
      - 'scripts/repair_social_sources.py'
      - 'scripts/enrich_social_images.py'
      - 'scripts/enrich_weibo_images.py'
      - 'scripts/normalize_weibo_cdn.py'
      - 'scripts/mirror_weibo_images.py'
      - 'scripts/enrich_bilibili_images.py'
      - 'scripts/upgrade_x_images.py'
      - 'scripts/fetch_taptap_official.py'
      - 'scripts/fetch_haoyoukuaibao.py'
      - 'scripts/fetch_wechat_official.py'
      - 'scripts/merge_duplicate_sources.py'
      - 'scripts/discover_web_news.py'
      - 'scripts/enrich_images.py'
      - 'scripts/filter_small_images.py'
      - 'scripts/normalize_news.py'
      - 'scripts/translation_engine.py'
      - 'scripts/translation_quality.py'
      - 'scripts/strict_gemma_translate.py'
      - 'scripts/merge_translation_results.py'
      - 'scripts/glossary_schema.py'
      - 'scripts/apply_sol_edits.py'
      - 'data/translation_glossary.json'
      - 'data/sol_news.json'
      - 'data/sol_overrides.json'
      - 'data/refresh_kick.json'
      - '.github/workflows/news-refresh.yml'

permissions:
  contents: write

concurrency:
  group: kirapara-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A second, workflow-level fuse protects against runner or child-process
    # failures that outlive the per-collector hard deadlines.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public news in original languages
        # Each network collector has a hard wall-clock deadline. Optional-step
        # failures restore their pre-step data snapshot and continue with the
        # last-known-good cache instead of blocking the whole hourly refresh.
        run: python -u scripts/run_refresh_pipeline.py

      - name: Merge Sol supplemental news and reviewed translations
        run: python scripts/apply_sol_edits.py

      - name: Apply only Japanese-safe cached translations without running the LLM
        run: python -u scripts/strict_gemma_translate.py prepare

      - name: Reapply Sol locks
        run: python scripts/apply_sol_edits.py

      - name: Mirror Weibo images for browser-safe delivery
        run: python scripts/mirror_weibo_images.py

      - name: Record completed crawl time
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "lastCrawlAt": datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "source": "news-refresh.yml",
          }
          Path("data/crawl_status.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit refreshed news and crawl status with semantic retry
        run: |
          if [ -z "$(git status --porcelain -- data/news.json data/translations.json data/article_dates.json data/image_quality.json data/crawl_status.json docs/media/weibo)" ]; then
            echo "No news, date, image-quality, translation, crawl-status or Weibo mirror changes"
            exit 0
          fi

          remote_cache="${RUNNER_TEMP}/main-translations.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json data/article_dates.json data/image_quality.json data/crawl_status.json docs/media/weibo
          git commit -m "chore: refresh normalized news"

          for attempt in 1 2 3 4; do
            echo "Refresh push attempt ${attempt}/4"
            git fetch origin main

            if ! git merge-base --is-ancestor origin/main HEAD; then
              local_head="$(git rev-parse HEAD)"
              set +e
              git merge --no-commit --no-ff origin/main
              merge_status=$?
              set -e

              conflicts="$(git diff --name-only --diff-filter=U)"
              unexpected_conflicts="$(printf '%s\n' "$conflicts" | grep -vFx -e '' -e 'data/news.json' -e 'data/translations.json' || true)"
              if [ -n "$unexpected_conflicts" ]; then
                echo "Unexpected merge conflicts:"
                printf '%s\n' "$unexpected_conflicts"
                git merge --abort || true
                exit 1
              fi
              if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
                echo "Merge failed without a resolvable data-file conflict"
                git merge --abort || true
                exit 1
              fi

              # Keep this run's newly collected article set, then fold in any
              # translations that reached main while collection was running.
              git show origin/main:data/translations.json > "$remote_cache"
              git checkout "$local_head" -- data/news.json data/translations.json
              python scripts/merge_translation_results.py --incoming "$remote_cache"
              python scripts/apply_sol_edits.py
              python scripts/strict_gemma_translate.py prepare
              git add data/news.json data/translations.json

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved merge conflicts remain"
                git merge --abort || true
                exit 1
              fi
              git commit --no-edit
            fi

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Refresh push failed after retries"
          exit 1
