name: Refresh News Cache

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_news.py'
      - 'scripts/merge_direct_official.py'
      - 'scripts/enrich_sources.py'
      - 'scripts/discover_web_news.py'
      - 'scripts/discover_web_news_v2.py'
      - 'scripts/enrich_images.py'
      - '.github/workflows/news-refresh.yml'

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public news in original languages
        run: |
          python scripts/fetch_news.py
          python scripts/merge_direct_official.py
          python scripts/enrich_sources.py
          python scripts/discover_web_news.py
          python scripts/discover_web_news_v2.py
          python scripts/enrich_images.py

      - name: Commit cache when changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: refresh news cache"
          git pull --rebase origin main
          git push
