name: Regenerate AI Article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: kirapara-data-writer
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[AI再生成]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate translation inputs
        run: |
          python scripts/validate_pipeline_state.py \
            --news data/news.json \
            --translations data/translations.json

      - name: Read article ID
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          ARTICLE_ID="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^articleId:[[:space:]]*//p' | head -n 1 | tr -cd 'A-Za-z0-9_-')"
          if [ -z "$ARTICLE_ID" ]; then
            echo "No articleId in issue body" >&2
            exit 1
          fi
          echo "article_id=$ARTICLE_ID" >> "$GITHUB_OUTPUT"

      - name: Restore Gemma 4 E4B LiteRT model cache
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-gemma4-e4b-litertlm-v1

      - name: Download Gemma 4 E4B LiteRT model
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/gemma-4-E4B-it.litertlm"
          SHA256="0b2a8980ce155fd97673d8e820b4d29d9c7d99b8fa6806f425d969b145bd52e0"
          URL="https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it.litertlm?download=true"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then
            echo "Gemma 4 LiteRT model already verified"
          else
            curl -fL --http1.1 \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 -C - \
              -o "$MODEL" "$URL"
            echo "$SHA256  $MODEL" | sha256sum -c -
          fi

      - name: Save Gemma 4 E4B LiteRT model cache
        if: steps.model_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-gemma4-e4b-litertlm-v1

      - name: Install LiteRT-LM runtime
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "litert-lm==0.16.1"

      - name: Regenerate translation and summary in strict Japanese
        run: |
          python -u scripts/strict_gemma_translate.py regenerate \
            --article-id "${{ steps.request.outputs.article_id }}" \
            --model "$HOME/.cache/kirapara-models/gemma-4-E4B-it.litertlm"

      - name: Commit regenerated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          if git diff --cached --quiet; then
            echo "No AI changes"
          else
            git commit -m "chore: regenerate AI with Gemma 4 E4B for ${{ steps.request.outputs.article_id }}"
            git pull --rebase origin main
            git push
          fi

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARTICLE_ID: ${{ steps.request.outputs.article_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "AI再生成が完了しました。articleId: $ARTICLE_ID"
          gh issue close "$ISSUE_NUMBER" --reason completed
