name: Regenerate AI Article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[AI再生成]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read article ID
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          ARTICLE_ID="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^articleId:[[:space:]]*//p' | head -n 1 | tr -cd 'A-Za-z0-9_-')"
          if [ -z "$ARTICLE_ID" ]; then
            echo "No articleId in issue body" >&2
            exit 1
          fi
          echo "article_id=$ARTICLE_ID" >> "$GITHUB_OUTPUT"

      - name: Cache Qwen 3B GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-qwen2.5-3b-instruct-q4-k-m-v1

      - name: Download Qwen 3B GGUF
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/qwen2.5-3b-instruct-q4_k_m.gguf"
          SHA256="626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then rm -f "$MODEL"; fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 -o "$MODEL" \
              "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install local llama.cpp runtime
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "llama-cpp-python==0.3.16" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Regenerate translation and summary
        run: |
          python -u scripts/run_with_runtime_glossary.py scripts/regenerate_ai.py \
            --article-id "${{ steps.request.outputs.article_id }}" \
            --model "$HOME/.cache/kirapara-models/qwen2.5-3b-instruct-q4_k_m.gguf"

      - name: Commit regenerated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          if git diff --cached --quiet; then
            echo "No AI changes"
          else
            git commit -m "chore: regenerate AI for ${{ steps.request.outputs.article_id }}"
            git pull --rebase origin main
            git push
          fi

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARTICLE_ID: ${{ steps.request.outputs.article_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "AI再生成が完了しました。articleId: $ARTICLE_ID"
          gh issue close "$ISSUE_NUMBER" --reason completed
