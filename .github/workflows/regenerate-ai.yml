name: Regenerate AI Article

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[AI再生成]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read article ID
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          ARTICLE_ID="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^articleId:[[:space:]]*//p' | head -n 1 | tr -cd 'A-Za-z0-9_-')"
          if [ -z "$ARTICLE_ID" ]; then
            echo "No articleId in issue body" >&2
            exit 1
          fi
          echo "article_id=$ARTICLE_ID" >> "$GITHUB_OUTPUT"

      - name: Cache LFM2.5 8B A1B GGUF
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirapara-models
          key: kirapara-lfm2.5-8b-a1b-q4-k-m-v1

      - name: Download LFM2.5 8B A1B GGUF
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/kirapara-models"
          MODEL="$MODEL_DIR/LFM2.5-8B-A1B-Q4_K_M.gguf"
          SHA256="4923ec14f06b968b74d663e5949867d2d9c3bf13a20b8be1a9f9af39989b2bb0"
          mkdir -p "$MODEL_DIR"
          if [ -f "$MODEL" ] && ! echo "$SHA256  $MODEL" | sha256sum -c - >/dev/null 2>&1; then rm -f "$MODEL"; fi
          if [ ! -f "$MODEL" ]; then
            curl -fL --retry 4 --retry-delay 5 -o "$MODEL" \
              "https://huggingface.co/LiquidAI/LFM2.5-8B-A1B-GGUF/resolve/main/LFM2.5-8B-A1B-Q4_K_M.gguf?download=true"
          fi
          echo "$SHA256  $MODEL" | sha256sum -c -

      - name: Install LFM2.5-compatible llama.cpp runtime
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary \
            "llama-cpp-python==0.3.34" \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Regenerate translation and summary in strict Japanese
        run: |
          python -u scripts/strict_lfm_translate.py regenerate \
            --article-id "${{ steps.request.outputs.article_id }}" \
            --model "$HOME/.cache/kirapara-models/LFM2.5-8B-A1B-Q4_K_M.gguf"

      - name: Commit regenerated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/translations.json
          if git diff --cached --quiet; then
            echo "No AI changes"
          else
            git commit -m "chore: regenerate AI for ${{ steps.request.outputs.article_id }}"
            git pull --rebase origin main
            git push
          fi

      - name: Close completed request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ARTICLE_ID: ${{ steps.request.outputs.article_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "AI再生成が完了しました。articleId: $ARTICLE_ID"
          gh issue close "$ISSUE_NUMBER" --reason completed
